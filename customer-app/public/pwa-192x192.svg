<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Enhanced racing gradients and effects -->
  <defs>
    <linearGradient id="racingBg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(15, 23, 42);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(30, 30, 46);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(15, 23, 42);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carBody192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(239, 68, 68);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(220, 38, 38);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(185, 28, 28);stop-opacity:1" />
    </linearGradient>
    <radialGradient id="flame192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(251, 191, 36);stop-opacity:1" />
      <stop offset="30%" style="stop-color:rgb(245, 158, 11);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgb(239, 68, 68);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(220, 38, 38);stop-opacity:0.8" />
    </radialGradient>
    <linearGradient id="spoiler192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(75, 85, 99);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(31, 41, 55);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with enhanced motion effect -->
  <circle cx="96" cy="96" r="92" fill="url(#racingBg192)" stroke="rgb(59, 130, 246)" stroke-width="4"/>

  <!-- Dynamic speed lines (enhanced motion effect) -->
  <path d="M15 96 L45 96 M147 96 L177 96" stroke="rgb(59, 130, 246)" stroke-width="3" opacity="0.8"/>
  <path d="M10 86 L40 86 M152 106 L182 106" stroke="rgb(59, 130, 246)" stroke-width="2" opacity="0.6"/>
  <path d="M20 76 L50 76 M142 116 L172 116" stroke="rgb(59, 130, 246)" stroke-width="2" opacity="0.4"/>
  <path d="M5 66 L35 66 M157 126 L187 126" stroke="rgb(59, 130, 246)" stroke-width="1" opacity="0.3"/>
  <path d="M25 56 L55 56 M137 136 L167 136" stroke="rgb(59, 130, 246)" stroke-width="1" opacity="0.2"/>

  <!-- Car body (aggressive racing style) -->
  <rect x="35" y="68" width="122" height="46" rx="18" fill="url(#carBody192)" stroke="rgb(251, 191, 36)" stroke-width="3"/>

  <!-- Racing stripes (more aggressive) -->
  <rect x="35" y="78" width="122" height="4" fill="rgb(251, 191, 36)"/>
  <rect x="35" y="86" width="122" height="4" fill="rgb(251, 191, 36)"/>
  <rect x="35" y="94" width="122" height="4" fill="rgb(251, 191, 36)"/>

  <!-- Car roof (sleek racing design) -->
  <rect x="45" y="50" width="102" height="26" rx="13" fill="url(#carBody192)" stroke="rgb(251, 191, 36)" stroke-width="2"/>

  <!-- Windows with racing tint -->
  <rect x="50" y="53" width="92" height="20" rx="10" fill="rgb(17, 24, 39)" opacity="0.9" stroke="rgb(251, 191, 36)" stroke-width="1"/>

  <!-- Racing spoiler -->
  <rect x="75" y="42" width="42" height="12" rx="6" fill="url(#spoiler192)" stroke="rgb(251, 191, 36)" stroke-width="1"/>
  <rect x="85" y="38" width="22" height="8" rx="4" fill="url(#spoiler192)" stroke="rgb(251, 191, 36)" stroke-width="1"/>

  <!-- Wheels (racing style with better detail) -->
  <circle cx="58" cy="126" r="16" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="3"/>
  <circle cx="134" cy="126" r="16" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="3"/>
  <circle cx="58" cy="126" r="10" fill="rgb(59, 130, 246)"/>
  <circle cx="134" cy="126" r="10" fill="rgb(59, 130, 246)"/>
  <circle cx="58" cy="126" r="5" fill="rgb(251, 191, 36)"/>
  <circle cx="134" cy="126" r="5" fill="rgb(251, 191, 36)"/>
  <!-- Wheel bolts -->
  <circle cx="54" cy="122" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="62" cy="122" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="54" cy="130" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="62" cy="130" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="130" cy="122" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="138" cy="122" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="130" cy="130" r="1" fill="rgb(251, 191, 36)"/>
  <circle cx="138" cy="130" r="1" fill="rgb(251, 191, 36)"/>

  <!-- Headlights (bright LED racing lights) -->
  <circle cx="148" cy="88" r="7" fill="rgb(251, 191, 36)" opacity="1"/>
  <circle cx="44" cy="88" r="7" fill="rgb(251, 191, 36)" opacity="1"/>
  <circle cx="148" cy="88" r="4" fill="white"/>
  <circle cx="44" cy="88" r="4" fill="white"/>
  <!-- Additional LED accents -->
  <circle cx="152" cy="82" r="2" fill="rgb(251, 191, 36)" opacity="0.8"/>
  <circle cx="40" cy="82" r="2" fill="rgb(251, 191, 36)" opacity="0.8"/>

  <!-- Air intakes (racing style) -->
  <rect x="42" y="100" width="8" height="6" rx="2" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="1"/>
  <rect x="142" y="100" width="8" height="6" rx="2" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="1"/>

  <!-- Massive exhaust flames (racing style) -->
  <ellipse cx="28" cy="108" rx="12" ry="6" fill="url(#flame192)" opacity="0.9"/>
  <ellipse cx="24" cy="106" rx="10" ry="5" fill="rgb(239, 68, 68)" opacity="0.8"/>
  <ellipse cx="20" cy="104" rx="8" ry="4" fill="rgb(220, 38, 38)" opacity="0.7"/>
  <ellipse cx="164" cy="108" rx="12" ry="6" fill="url(#flame192)" opacity="0.9"/>
  <ellipse cx="168" cy="106" rx="10" ry="5" fill="rgb(239, 68, 68)" opacity="0.8"/>
  <ellipse cx="172" cy="104" rx="8" ry="4" fill="rgb(220, 38, 38)" opacity="0.7"/>

  <!-- TAXI text on roof with racing font effect -->
  <text x="96" y="68" text-anchor="middle" fill="rgb(251, 191, 36)" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TAXI</text>
  <!-- Racing number on side -->
  <text x="96" y="95" text-anchor="middle" fill="rgb(251, 191, 36)" font-family="Arial, sans-serif" font-size="8" font-weight="bold">NFT</text>
</svg>