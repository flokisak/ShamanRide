<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Enhanced racing gradients and effects -->
  <defs>
    <linearGradient id="racingBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(15, 23, 42);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(30, 30, 46);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(15, 23, 42);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carBody512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(239, 68, 68);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(220, 38, 38);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(185, 28, 28);stop-opacity:1" />
    </linearGradient>
    <radialGradient id="flame512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(251, 191, 36);stop-opacity:1" />
      <stop offset="30%" style="stop-color:rgb(245, 158, 11);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgb(239, 68, 68);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(220, 38, 38);stop-opacity:0.8" />
    </radialGradient>
    <linearGradient id="spoiler512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(75, 85, 99);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(31, 41, 55);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with enhanced motion effect -->
  <circle cx="256" cy="256" r="248" fill="url(#racingBg512)" stroke="rgb(59, 130, 246)" stroke-width="8"/>

  <!-- Dynamic speed lines (enhanced motion effect) -->
  <path d="M30 256 L90 256 M422 256 L482 256" stroke="rgb(59, 130, 246)" stroke-width="8" opacity="0.8"/>
  <path d="M20 230 L80 230 M432 282 L492 282" stroke="rgb(59, 130, 246)" stroke-width="6" opacity="0.6"/>
  <path d="M40 204 L100 204 M412 308 L472 308" stroke="rgb(59, 130, 246)" stroke-width="4" opacity="0.4"/>
  <path d="M10 178 L70 178 M442 334 L502 334" stroke="rgb(59, 130, 246)" stroke-width="3" opacity="0.3"/>
  <path d="M50 152 L110 152 M402 360 L462 360" stroke="rgb(59, 130, 246)" stroke-width="2" opacity="0.2"/>

  <!-- Car body (aggressive racing style) -->
  <rect x="90" y="182" width="332" height="124" rx="50" fill="url(#carBody512)" stroke="rgb(251, 191, 36)" stroke-width="8"/>

  <!-- Racing stripes (more aggressive) -->
  <rect x="90" y="210" width="332" height="12" fill="rgb(251, 191, 36)"/>
  <rect x="90" y="230" width="332" height="12" fill="rgb(251, 191, 36)"/>
  <rect x="90" y="250" width="332" height="12" fill="rgb(251, 191, 36)"/>

  <!-- Car roof (sleek racing design) -->
  <rect x="122" y="134" width="268" height="70" rx="35" fill="url(#carBody512)" stroke="rgb(251, 191, 36)" stroke-width="6"/>

  <!-- Windows with racing tint -->
  <rect x="136" y="144" width="240" height="50" rx="25" fill="rgb(17, 24, 39)" opacity="0.9" stroke="rgb(251, 191, 36)" stroke-width="3"/>

  <!-- Racing spoiler -->
  <rect x="200" y="114" width="112" height="32" rx="16" fill="url(#spoiler512)" stroke="rgb(251, 191, 36)" stroke-width="3"/>
  <rect x="228" y="102" width="56" height="20" rx="10" fill="url(#spoiler512)" stroke="rgb(251, 191, 36)" stroke-width="2"/>

  <!-- Wheels (racing style with better detail) -->
  <circle cx="154" cy="338" r="42" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="8"/>
  <circle cx="358" cy="338" r="42" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="8"/>
  <circle cx="154" cy="338" r="26" fill="rgb(59, 130, 246)"/>
  <circle cx="358" cy="338" r="26" fill="rgb(59, 130, 246)"/>
  <circle cx="154" cy="338" r="14" fill="rgb(251, 191, 36)"/>
  <circle cx="358" cy="338" r="14" fill="rgb(251, 191, 36)"/>
  <!-- Wheel bolts -->
  <circle cx="142" cy="326" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="166" cy="326" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="142" cy="350" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="166" cy="350" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="346" cy="326" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="370" cy="326" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="346" cy="350" r="3" fill="rgb(251, 191, 36)"/>
  <circle cx="370" cy="350" r="3" fill="rgb(251, 191, 36)"/>

  <!-- Headlights (bright LED racing lights) -->
  <circle cx="398" cy="236" r="18" fill="rgb(251, 191, 36)" opacity="1"/>
  <circle cx="114" cy="236" r="18" fill="rgb(251, 191, 36)" opacity="1"/>
  <circle cx="398" cy="236" r="10" fill="white"/>
  <circle cx="114" cy="236" r="10" fill="white"/>
  <!-- Additional LED accents -->
  <circle cx="408" cy="218" r="6" fill="rgb(251, 191, 36)" opacity="0.8"/>
  <circle cx="104" cy="218" r="6" fill="rgb(251, 191, 36)" opacity="0.8"/>

  <!-- Air intakes (racing style) -->
  <rect x="108" y="268" width="20" height="16" rx="5" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="2"/>
  <rect x="384" y="268" width="20" height="16" rx="5" fill="rgb(17, 24, 39)" stroke="rgb(251, 191, 36)" stroke-width="2"/>

  <!-- Massive exhaust flames (racing style) -->
  <ellipse cx="68" cy="290" rx="32" ry="16" fill="url(#flame512)" opacity="0.9"/>
  <ellipse cx="56" cy="282" rx="26" ry="13" fill="rgb(239, 68, 68)" opacity="0.8"/>
  <ellipse cx="44" cy="274" rx="20" ry="10" fill="rgb(220, 38, 38)" opacity="0.7"/>
  <ellipse cx="444" cy="290" rx="32" ry="16" fill="url(#flame512)" opacity="0.9"/>
  <ellipse cx="456" cy="282" rx="26" ry="13" fill="rgb(239, 68, 68)" opacity="0.8"/>
  <ellipse cx="468" cy="274" rx="20" ry="10" fill="rgb(220, 38, 38)" opacity="0.7"/>

  <!-- TAXI text on roof with racing font effect -->
  <text x="256" y="182" text-anchor="middle" fill="rgb(251, 191, 36)" font-family="Arial, sans-serif" font-size="32" font-weight="bold">TAXI</text>
  <!-- Racing number on side -->
  <text x="256" y="255" text-anchor="middle" fill="rgb(251, 191, 36)" font-family="Arial, sans-serif" font-size="20" font-weight="bold">NFT</text>
</svg>